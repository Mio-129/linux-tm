name: Build (linux-tm fork)

on:
  push:
    branches:
      - master
      - 'arena/**'
      - 'mio/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Show APK files
        if: always()
        run: |
          ls -l ./app/build/outputs/apk/debug/ || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-${{ matrix.package_variant }}-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Also attach the APKs to a release tagged with the branch name (like `arena/04a67b33-linux-tm`)
      # on successful pushes, so that the APKs can be downloaded from the releases page as well
      - name: Publish debug APKs to a release
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-$(printf '%s' "${{ github.ref_name }}" | tr '/' '-')"
          TITLE="Debug APKs (${{ github.ref_name }} @ ${{ github.sha }})"
          NOTES="Debug APKs built from commit ${{ github.sha }} of branch ${{ github.ref_name }}."
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --repo "${{ github.repository }}" --clobber
          gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES"
